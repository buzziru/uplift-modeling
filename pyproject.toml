[project]
name = "uplift-modeling"
version = "0.1.0"
description = "Hillstrom 이메일 실험 데이터 uplift modeling"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy",
    "pandas",
    "pyarrow",
    "duckdb",
    "scikit-learn",
    "lightgbm",
    "scikit-uplift",
    "causalml",
    "pydantic",
    "pyyaml",
    "marimo",
    "seaborn",
    "matplotlib",
]

[dependency-groups]
dev = [
    "ruff",
    "pyright",
    "pytest",
    "hypothesis",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/uplift"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pyright]
include = ["src", "scripts", "tests"]
pythonVersion = "3.12"
venvPath = "."
venv = ".venv"
